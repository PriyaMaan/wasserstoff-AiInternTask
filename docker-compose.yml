version: '3.8'  

services:  
  backend:  
    build: .  
    ports:  
      - "8000:8000"  
    environment:  
      - AI_ENDPOINT=${AI_ENDPOINT}  
      - AI_API_KEY=${AI_API_KEY}  
      - REDIS_HOST=redis  
  redis:  
    image: "redis:alpine"  
  db:  
    image: "postgres:alpine"  
    restart: always  
    environment:  
      POSTGRES_DB: game_db  
      POSTGRES_USER: user  
      POSTGRES_PASSWORD: password  